<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style/calculator.css">
        <title>JS | The Odin Project</title>
    </head>
    <body>

        <div class="container">

            <!-- CALCULATRICE -->
             <div class="calculatrice">

                <input type="text" id="affichage" class="affichage">

                <!-- BTN SECTION -->
                <div class="parent_container">

                    <div class="parent">
                        <div class="div div1">7</div>
                        <div class="div div2">8</div>
                        <div class="div div3">9</div>
                        <div class="div div4">4</div>
                        <div class="div div5">5</div>
                        <div class="div div6">6</div>
                        <div class="div div7">1</div>
                        <div class="div div8">2</div>
                        <div class="div div9">3</div>
                        <div class="div div10">.</div>
                        <div class="div div11">0</div>
                        <div class="div div12">/</div>
                        <div class="div div13">x</div>
                        <div class="div div14">-</div>
                        <div class="div div15">+</div>
                        <div class="div div16 delete">del</div>
                        <div class="div div17 reset">reset</div>
                        <div class="div div18 equal">=</div>
                    </div>
                </div>
             </div>
        </div>
        
        <a href="../index.html" class="backlink">Retour au début</a>

        <script src="js/calculator.js"></script>
    </body>
</html>
